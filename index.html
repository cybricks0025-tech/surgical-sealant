<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SHM 雙腔混合頭 v2（驗證修正版）· 3D 互動展示</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/renderers/CSS2DRenderer.js"></script>
<style>
  :root {
    --bg:#0f172a; --text:#f8fafc; --sub:#cbd5e1; --muted:#94a3b8;
    --panel:rgba(15,23,42,.94); --border:rgba(125,211,252,.25);
    --box:rgba(30,41,59,.8); --boxb:rgba(255,255,255,.08);
    --fbg:rgba(2,6,23,.7); --fcol:#6ee7b7; --accent:#38bdf8;
    --shadow:rgba(0,0,0,.55); --lbl:rgba(15,23,42,.85); --lbltext:#e2e8f0;
  }
  body.light-mode {
    --bg:#dbe4ee; --text:#0f172a; --sub:#1e293b; --muted:#475569;
    --panel:rgba(255,255,255,.96); --border:rgba(2,132,199,.35);
    --box:#f1f5f9; --boxb:rgba(0,0,0,.12);
    --fbg:#e2e8f0; --fcol:#047857; --accent:#0369a1;
    --shadow:rgba(15,23,42,.18); --lbl:rgba(255,255,255,.92); --lbltext:#0f172a;
  }
  * { box-sizing:border-box; margin:0; padding:0; font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Segoe UI",Roboto,sans-serif; }
  body { background:var(--bg); color:var(--text); overflow:hidden; height:100vh; }
  #canvas { position:absolute; inset:0; }
  #header { position:absolute; top:14px; left:20px; z-index:10; pointer-events:none; max-width:46vw; }
  #header h1 { font-size:19px; font-weight:800; letter-spacing:.3px; }
  .badge { display:inline-block; margin-left:8px; padding:3px 10px; border-radius:20px; font-size:11px; font-weight:700;
           color:#fff; background:#059669; vertical-align:middle; }
  #legend { margin-top:8px; display:flex; flex-wrap:wrap; gap:10px; font-size:12px; color:var(--muted); font-weight:600; }
  #legend i { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:5px; vertical-align:-1px; }
  #step-nav { position:absolute; top:14px; left:50%; transform:translateX(-50%); z-index:10; display:flex; gap:8px;
              background:var(--panel); padding:6px 12px; border-radius:24px; border:1px solid var(--border); box-shadow:0 8px 24px var(--shadow); }
  .dot { width:34px; height:34px; border-radius:50%; border:1px solid var(--boxb); display:flex; align-items:center; justify-content:center;
         font-weight:800; font-size:13px; color:var(--muted); cursor:pointer; transition:.2s; }
  .dot:hover { color:var(--text); border-color:var(--accent); }
  .dot.active { background:#0284c7; color:#fff; border-color:#0284c7; transform:scale(1.08); }
  #info { position:absolute; top:70px; right:18px; width:430px; z-index:10; background:var(--panel); border:1px solid var(--border);
          border-radius:16px; padding:20px; box-shadow:0 18px 44px var(--shadow); max-height:calc(100vh - 150px); overflow-y:auto; backdrop-filter:blur(16px); }
  #info::-webkit-scrollbar { width:6px; } #info::-webkit-scrollbar-thumb { background:#94a3b8; border-radius:4px; }
  #info h3 { font-size:17px; color:var(--accent); margin-bottom:8px; font-weight:800; }
  #info p { font-size:13px; color:var(--sub); line-height:1.65; margin-bottom:10px; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px; }
  .chip { font-size:11px; font-weight:700; padding:3px 8px; border-radius:6px; border:1px solid; }
  .ok   { color:#047857; background:rgba(16,185,129,.12); border-color:#10b981; }
  .fix  { color:#b45309; background:rgba(245,158,11,.12); border-color:#f59e0b; }
  .bad  { color:#be123c; background:rgba(244,63,94,.10); border-color:#f43f5e; }
  .tip  { color:#0369a1; background:rgba(56,189,248,.12); border-color:#38bdf8; }
  body:not(.light-mode) .ok{color:#6ee7b7} body:not(.light-mode) .fix{color:#fcd34d}
  body:not(.light-mode) .bad{color:#fda4af} body:not(.light-mode) .tip{color:#7dd3fc}
  .sec { display:block; font-size:11px; font-weight:800; letter-spacing:.8px; color:var(--muted); margin:12px 0 6px; border-left:3px solid var(--accent); padding-left:6px; }
  .box { background:var(--box); border:1px solid var(--boxb); border-radius:10px; padding:11px 12px; font-size:12.5px; line-height:1.6; color:var(--text); }
  .box ul { padding-left:16px; } .box li { margin:3px 0; }
  .box b { color:var(--accent); }
  .f { display:block; background:var(--fbg); border:1px dashed var(--accent); color:var(--fcol); border-radius:6px; padding:5px 8px;
       margin:6px 0; text-align:center; font-family:"SF Mono",Menlo,Consolas,monospace; font-size:12px; font-weight:700; }
  .row { display:flex; justify-content:space-between; gap:10px; font-size:12px; padding:5px 0; border-bottom:1px solid var(--boxb); color:var(--muted); }
  .row strong { color:var(--text); text-align:right; }
  table.t { width:100%; border-collapse:collapse; font-size:11.5px; }
  table.t td, table.t th { border-bottom:1px solid var(--boxb); padding:5px 4px; vertical-align:top; text-align:left; }
  table.t th { color:var(--muted); font-weight:800; }
  #toolbar { position:absolute; bottom:18px; left:50%; transform:translateX(-50%); z-index:10; display:flex; flex-wrap:wrap; justify-content:center; gap:6px;
             background:var(--panel); padding:7px 12px; border-radius:28px; border:1px solid var(--border); box-shadow:0 12px 32px var(--shadow); max-width:96vw; }
  .btn { background:transparent; border:none; color:var(--muted); padding:7px 13px; border-radius:18px; font-size:12.5px; font-weight:700; cursor:pointer; transition:.2s; }
  .btn:hover { color:var(--text); background:rgba(148,163,184,.15); }
  .btn.on { background:#0284c7; color:#fff; }
  #xs { position:absolute; left:18px; bottom:84px; z-index:10; width:372px; background:var(--panel); border:1px solid var(--border);
        border-radius:14px; padding:12px; box-shadow:0 12px 32px var(--shadow); }
  #xs h4 { font-size:13px; font-weight:800; margin-bottom:6px; color:var(--accent); }
  #xs canvas { width:348px; height:150px; display:block; border-radius:8px; background:var(--box); }
  #xs input { width:100%; margin-top:8px; accent-color:#0284c7; }
  #xs .cap { font-size:11.5px; color:var(--sub); margin-top:4px; line-height:1.5; }
  #xs .note { font-size:10.5px; color:var(--muted); margin-top:4px; }
  .lbl { background:var(--lbl); color:var(--lbltext); border:1px solid var(--border); padding:3px 8px; border-radius:6px; font-size:11px;
         font-weight:700; white-space:nowrap; box-shadow:0 4px 12px var(--shadow); pointer-events:none; }
  .lbl small { display:block; font-weight:600; color:var(--muted); font-size:10px; }
  #hint { position:absolute; bottom:72px; left:50%; transform:translateX(-50%); z-index:5; font-size:11px; color:var(--muted); pointer-events:none; }
  @media (max-width:980px) {
    #info { width:calc(100vw - 24px); right:12px; top:auto; bottom:120px; max-height:38vh; }
    #xs { display:none !important; } #header { max-width:90vw; } #step-nav { top:auto; bottom:70px; }
  }
</style>
</head>
<body class="light-mode">
<div id="canvas"></div>

<div id="header">
  <h1>SHM 微流控雙腔混合頭 <span class="badge">v2 · 已重新驗證</span></h1>
  <div id="legend">
    <span><i style="background:#1d4ed8"></i>A：PEG-SG＋PEG-SH（S-buffer，酸性）</span>
    <span><i style="background:#d97706"></i>B：T-buffer（鹼性）</span>
    <span><i style="background:#059669"></i>A 相已達高 pH → 交聯中</span>
  </div>
</div>

<div id="step-nav">
  <div class="dot active" onclick="setStep(0)">1</div>
  <div class="dot" onclick="setStep(1)">2</div>
  <div class="dot" onclick="setStep(2)">3</div>
  <div class="dot" onclick="setStep(3)">4</div>
  <div class="dot" onclick="setStep(4)">5</div>
</div>

<div id="info">
  <h3 id="p-title"></h3>
  <div class="chips" id="p-chips"></div>
  <p id="p-desc"></p>
  <span class="sec">🔬 科學依據（已重新計算）</span>
  <div class="box" id="p-sci"></div>
  <span class="sec">📐 關鍵規格 / 估算值</span>
  <div id="p-metrics"></div>
  <span class="sec">🛠 與 v1 的差異</span>
  <div class="box" id="p-diff"></div>
</div>

<div id="xs">
  <h4>📊 截面混合觀察（流道橫截面 1.5 × 0.5 mm）</h4>
  <canvas id="xs-canvas"></canvas>
  <input id="xs-slider" type="range" min="0" max="8" step="1" value="0">
  <div class="cap" id="xs-cap"></div>
  <div class="note">示意性「交替雙渦旋」運動學模型（Stroock 2002 定性行為），非 CFD 結果。</div>
</div>

<div id="toolbar">
  <button class="btn on" id="b-theme" onclick="toggleTheme()">☀️ 白天</button>
  <button class="btn on" id="b-flow" onclick="toggleFlow()">🌊 流體粒子</button>
  <button class="btn on" id="b-shell" onclick="toggleShell()">🧊 外殼：半透明</button>
  <button class="btn on" id="b-syr" onclick="toggleSyr()">💉 注射筒</button>
  <button class="btn on" id="b-lbl" onclick="toggleLabels()">🏷 標註</button>
  <button class="btn on" id="b-xs" onclick="toggleXS()">📊 截面</button>
  <button class="btn" id="b-rot" onclick="toggleRot()">🔄 旋轉</button>
  <button class="btn" onclick="setStep(currentStep, true)">🎯 重置視角</button>
</div>
<div id="hint">左鍵旋轉 · 右鍵平移 · 滾輪縮放 ｜ 動畫為慢動作（實際流經混合段約 0.1 s）</div>

<script>
// =====================================================================
// 0. GEOMETRY (all units = mm) — matches verify_design.py
// =====================================================================
const G = {
  hubX: 5.5, hubBottom: 36, hubTop: 44,
  w: 1.5, h: 0.5, gd: 0.15, gw: 0.25, pitch: 0.6, perHalf: 6, halves: 8,
  chanTop: 31.2, bodyHalfW: 3.5, zMin: -1.5, zMax: 2.0, nozLen: 7.0
};
G.dy = G.gw * Math.SQRT2;                         // groove width measured along flow
G.apex0 = G.chanTop - 2 * G.w / 3 - G.dy - 0.1;   // first chevron apex (y)
G.nGroove = G.perHalf * G.halves;                 // 48 grooves
G.lastApex = G.apex0 - (G.nGroove - 1) * G.pitch;
G.mixEnd = G.lastApex - 0.15;                     // end of mixing channel
G.halfLen = G.perHalf * G.pitch;                  // 3.6 mm per half-cycle
G.grooveLen = G.halves * G.halfLen;               // 28.8 mm
G.chipBot = G.mixEnd - 0.6;
G.nozBot = G.chipBot - G.nozLen;
G.tissueY = G.nozBot - 4.5;
const STROOCK_A = 1.0e-2 / (200e-6 * Math.log(2e5)); // ≈ 4.1 (calibrated from Stroock 2002)

// =====================================================================
// 1. SCENE
// =====================================================================
let isDay = true;
const host = document.getElementById('canvas');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xdbe4ee);
const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.05, 2000);
camera.position.set(48, 40, 78);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
host.appendChild(renderer.domElement);

const labelRenderer = new THREE.CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'absolute', top: '0', left: '0', pointerEvents: 'none' });
host.appendChild(labelRenderer.domElement);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.06;
controls.minDistance = 2; controls.maxDistance = 220;
controls.target.set(0, 26, 0);

const hemi = new THREE.HemisphereLight(0xffffff, 0x94a3b8, 0.75); scene.add(hemi);
const key = new THREE.DirectionalLight(0xffffff, 1.1); key.position.set(30, 60, 50); scene.add(key);
const rim = new THREE.DirectionalLight(0x93c5fd, 0.55); rim.position.set(-40, 20, -30); scene.add(rim);
const front = new THREE.DirectionalLight(0xffffff, 0.45); front.position.set(0, 10, 60); scene.add(front);
let grid = null;

// =====================================================================
// 2. MATERIALS (colours re-applied by applyTheme)
// =====================================================================
const M = {
  shell:   new THREE.MeshStandardMaterial({ transparent: true, opacity: 0.2, roughness: 0.15, metalness: 0, side: THREE.DoubleSide, depthWrite: false }),
  edge:    new THREE.LineBasicMaterial({ transparent: true, opacity: 0.8 }),
  resin:   new THREE.MeshStandardMaterial({ roughness: 0.55, metalness: 0.05 }),
  floorTop:new THREE.MeshStandardMaterial({ roughness: 0.45, metalness: 0.05 }),
  floorBase:new THREE.MeshStandardMaterial({ roughness: 0.6, metalness: 0.1 }),
  cavity:  new THREE.MeshStandardMaterial({ transparent: true, opacity: 0.35, side: THREE.DoubleSide, depthWrite: false }),
  fluidA:  new THREE.MeshStandardMaterial({ transparent: true, opacity: 0.8, roughness: 0.25 }),
  fluidB:  new THREE.MeshStandardMaterial({ transparent: true, opacity: 0.8, roughness: 0.25 }),
  mixed:   new THREE.MeshStandardMaterial({ transparent: true, opacity: 0.65, roughness: 0.25 }),
  bead:    new THREE.MeshStandardMaterial({ transparent: true, opacity: 0.5, roughness: 0.2, depthWrite: false }),
  valve:   new THREE.MeshStandardMaterial({ color: 0xe11d48, roughness: 0.5, side: THREE.DoubleSide }),
  rubber:  new THREE.MeshStandardMaterial({ color: 0x1f2937, roughness: 0.8 }),
  plunger: new THREE.MeshStandardMaterial({ roughness: 0.5 }),
  tissue:  new THREE.MeshStandardMaterial({ transparent: true, opacity: 0.55, roughness: 0.9, side: THREE.DoubleSide, depthWrite: false })
};
const COL = {};
function palette() {
  return isDay ? {
    bg: 0xdbe4ee, shell: 0x7dd3fc, edge: 0x0369a1, resin: 0xcbd5e1, floorTop: 0xf1f5f9, floorBase: 0x1e293b,
    cavity: 0x64748b, A: 0x1d4ed8, B: 0xd97706, Bpale: 0xfde68a, gel: 0x059669, plunger: 0xf8fafc,
    tissue: 0xf9a8d4, grid1: 0x94a3b8, grid2: 0xcbd5e1
  } : {
    bg: 0x0f172a, shell: 0xbae6fd, edge: 0x7dd3fc, resin: 0x475569, floorTop: 0x94a3b8, floorBase: 0x020617,
    cavity: 0x94a3b8, A: 0x60a5fa, B: 0xfbbf24, Bpale: 0x78716c, gel: 0x34d399, plunger: 0xcbd5e1,
    tissue: 0x9d174d, grid1: 0x334155, grid2: 0x1e293b
  };
}

// =====================================================================
// 3. BUILD ASSEMBLY
// =====================================================================
const root = new THREE.Group(); scene.add(root);
const shellGroup = new THREE.Group(); root.add(shellGroup);   // translucent housings + lid
const syrGroup = new THREE.Group(); root.add(syrGroup);
const labels = [];

function edges(mesh, thr = 20) {
  const l = new THREE.LineSegments(new THREE.EdgesGeometry(mesh.geometry, thr), M.edge);
  mesh.add(l); return mesh;
}
function add(parent, geo, mat, x = 0, y = 0, z = 0, withEdges = false) {
  const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); parent.add(m);
  if (withEdges) edges(m); return m;
}
function label(html, x, y, z, group = 'main') {
  const d = document.createElement('div'); d.className = 'lbl'; d.innerHTML = html;
  const o = new THREE.CSS2DObject(d); o.position.set(x, y, z); root.add(o);
  o.userData.group = group; labels.push(o); return o;
}
const zc = G.h / 2; // channel mid-height

// ---------- 3.1 Dual syringes, linked plungers ----------
const fillH = 14;
[-1, 1].forEach(s => {
  const x = s * G.hubX;
  add(syrGroup, new THREE.CylinderGeometry(5, 5, 24, 48), M.shell, x, 58, zc, true);
  add(syrGroup, new THREE.CylinderGeometry(5, 2.3, 1.2, 48), M.shell, x, 45.4, zc, true);
  add(syrGroup, new THREE.CylinderGeometry(2.19, 1.96, 7.5, 32), M.shell, x, 41.05, zc, true); // male Luer 6 %
  add(syrGroup, new THREE.CylinderGeometry(4.3, 4.3, fillH, 40), s < 0 ? M.fluidA : M.fluidB, x, 46 + fillH / 2, zc);
  add(syrGroup, new THREE.CylinderGeometry(0.75, 0.75, 7.5, 16), s < 0 ? M.fluidA : M.fluidB, x, 41.05, zc);
  add(syrGroup, new THREE.CylinderGeometry(4.32, 4.32, 2.6, 40), M.rubber, x, 46 + fillH + 1.3, zc);
  add(syrGroup, new THREE.BoxGeometry(1.4, 12, 6), M.plunger, x, 46 + fillH + 2.6 + 6, zc);
  add(syrGroup, new THREE.BoxGeometry(6, 12, 1.4), M.plunger, x, 46 + fillH + 2.6 + 6, zc);
});
add(syrGroup, new THREE.BoxGeometry(23, 1.6, 9), M.plunger, 0, 46 + fillH + 2.6 + 12.8, zc, true); // linked thumb plate
label('雙注射筒（同內徑）＋推桿聯動<small>1:1 配比由「排量」決定，不靠流阻</small>', 0, 82, zc, 'syr');

// ---------- 3.2 Female Luer-lock hubs ----------
[-1, 1].forEach(s => {
  const x = s * G.hubX;
  add(shellGroup, new THREE.CylinderGeometry(3.9, 3.9, 8, 48), M.shell, x, 40, zc, true);
  add(root, new THREE.CylinderGeometry(2.2, 1.98, 7.5, 32, 1, true), M.cavity, x, 40.2, zc);
  [0, Math.PI].forEach(a => add(shellGroup, new THREE.BoxGeometry(1.2, 1.0, 1.6), M.shell,
    x + Math.cos(a) * 4.3, 43.5, zc + Math.sin(a) * 4.3, true));
});
label('母 Luer-lock ×2<small>ISO 80369-7</small>', -G.hubX - 9, 40, zc);

// ---------- 3.3 Inlet manifold + equal-volume inlet channels ----------
const manShape = new THREE.Shape();
manShape.moveTo(-9.5, G.hubBottom); manShape.lineTo(9.5, G.hubBottom);
manShape.lineTo(G.bodyHalfW, G.chanTop); manShape.lineTo(-G.bodyHalfW, G.chanTop); manShape.closePath();
const manGeo = new THREE.ExtrudeGeometry(manShape, { depth: G.zMax - G.zMin, bevelEnabled: false });
const manMesh = add(shellGroup, manGeo, M.shell, 0, 0, G.zMin, true);

const curves = [-1, 1].map(s => new THREE.CatmullRomCurve3([
  new THREE.Vector3(s * G.hubX, 37.3, zc),
  new THREE.Vector3(s * G.hubX, 35.6, zc),
  new THREE.Vector3(s * 3.0, 33.5, zc),
  new THREE.Vector3(s * 0.95, 31.95, zc),
  new THREE.Vector3(s * 0.375, G.chanTop - 0.05, zc)
], false, 'centripetal'));
curves.forEach((c, i) => add(root, new THREE.TubeGeometry(c, 64, 0.4, 16, false), i === 0 ? M.fluidA : M.fluidB));
const curveLen = curves[0].getLength();
label(`等長·等徑入口 Ø0.8 mm<small>各 ≈ ${(curveLen * Math.PI * 0.16).toFixed(1)} µL，避免前後到達差（lead/lag）</small>`, 9, 33.5, zc);

// ---------- 3.4 Mixing chip: side walls, grooved floor, lid ----------
const chipLen = G.chanTop - G.chipBot, chipMidY = (G.chanTop + G.chipBot) / 2;
const sideW = G.bodyHalfW - G.w / 2;
[-1, 1].forEach(s => add(root, new THREE.BoxGeometry(sideW, chipLen, G.h - G.zMin), M.resin,
  s * (G.w / 2 + sideW / 2), chipMidY, (G.zMin + G.h) / 2, true));
add(root, new THREE.BoxGeometry(G.w, chipLen, -G.gd - G.zMin), M.floorBase, 0, chipMidY, (G.zMin - G.gd) / 2);

// grooved floor layer: rectangle with 48 asymmetric chevron holes (true recessed grooves)
const floorShape = new THREE.Shape();
floorShape.moveTo(-G.w / 2, G.chipBot); floorShape.lineTo(G.w / 2, G.chipBot);
floorShape.lineTo(G.w / 2, G.chanTop); floorShape.lineTo(-G.w / 2, G.chanTop); floorShape.closePath();
const m = 0.03, xl = -G.w / 2 + m, xr = G.w / 2 - m;
for (let i = 0; i < G.nGroove; i++) {
  const k = Math.floor(i / G.perHalf);
  const xa = (k % 2 === 0) ? -G.w / 6 : G.w / 6;   // apex at 1/3 width, alternating each half-cycle
  const ya = G.apex0 - i * G.pitch;
  const dL = xa - xl, dR = xr - xa;                // 45°: rise = run
  const p = new THREE.Path();
  p.moveTo(xl, ya + dL); p.lineTo(xa, ya); p.lineTo(xr, ya + dR);
  p.lineTo(xr, ya + dR + G.dy); p.lineTo(xa, ya + G.dy); p.lineTo(xl, ya + dL + G.dy); p.closePath();
  floorShape.holes.push(p);
}
const floorGeo = new THREE.ExtrudeGeometry(floorShape, { depth: G.gd, bevelEnabled: false });
add(root, floorGeo, M.floorTop, 0, 0, -G.gd);

const lid = add(shellGroup, new THREE.BoxGeometry(2 * G.bodyHalfW, chipLen, G.zMax - G.h), M.shell, 0, chipMidY, (G.h + G.zMax) / 2, true);
label(`SHM 混合流道 1.5 × 0.5 mm<small>長 ${(G.chanTop - G.mixEnd).toFixed(1)} mm · 8 個半週期 · Re ≈ 20</small>`, 7.5, 20, zc);
label('人字形凹槽（凹刻於底面）<small>深 0.15 · 寬 0.25 · 45° · 頂點位於 1/3 寬並每 6 條交替</small>', -8.5, 26, zc);

      <tr><td>1</td><td><b>預混對照</b>：A、B 各 100 µL 在管中 1 s 內快速吸吐混合，量成膠時間（倒置法）</td><td>≈10 s → 化學限制，換混合頭沒用；≪10 s → 混合限制</td></tr>
      <tr><td>2</td><td><b>最終 pH</b>：不加 PEG，S-buffer : T-buffer = 1:1 混合後量 pH</td><td>確認是否達到配方目標</td></tr>
      <tr><td>3</td><td><b>簡易黏度</b>：1 mL 針筒＋固定針頭＋固定砝碼，量排空時間；以甘油水溶液標準品校正</td><td>取代假設的 50 cP</td></tr>
      <tr><td>4</td><td><b>pH 指示劑可視化</b>：A 相加 thymolphthalein（pH 9.3–10.5 變藍）或 phenolphthalein（8.2–10 變粉紅），用透明樹脂列印流道</td><td>直接看到 pH 在第幾個半週期跳升</td></tr>
      <tr><td>5</td><td><b>列印可行性</b>：同時印凹槽深 0.10 / 0.15 / 0.20 mm 三版，切開或顯微鏡確認凹槽未被樹脂填平</td><td>選出可重現的最小特徵</td></tr>
      <tr><td>6</td><td><b>專利（已查 Google Patents）</b>：US6969400B2 實為 Cohesion 的「交聯聚合物組成物」專利，且已到期，並非針筒夾具專利；US6328229B1（1998）已到期；EP2213245B1（Baxter，優先權 2006）狀態 Not-in-force，但其美國延續案（如 US11896939B2、US12629445B2）仍需逐一確認。其餘專利尚未逐件核對。</td><td>請以專利原文獨立項＋專利代理人 FTO 為準，本頁僅供技術討論</td></tr></table>`,
    m: [['可計算證明', '流態、壓降、滯留體積、pH 化學'], ['需實驗證明', '黏度比影響、成膠瓶頸、列印精度'], ['已撤回宣稱', '3 項（流阻配比、鏈拉伸、不堵槍）'], ['已修正數值', 'Re、溝槽深寬比、混合長度、倍率']],
    diff: '新增驗證實驗計畫；所有估算公式可在 scratch/verify_design.py 重現。',
    cam: [48, 40, 78], tgt: [0, 26, 0], xs: true, xsK: 4
  }
];

let currentStep = 0;
function setStep(i, forceCam = true) {
  currentStep = i;
  document.querySelectorAll('.dot').forEach((d, j) => d.classList.toggle('active', j === i));
  const s = steps[i];
  document.getElementById('p-title').textContent = s.title;
  document.getElementById('p-chips').innerHTML = s.chips.map(([c, t]) => `<span class="chip ${c}">${t}</span>`).join('');
  document.getElementById('p-desc').textContent = s.desc;
  document.getElementById('p-sci').innerHTML = s.sci;
  document.getElementById('p-metrics').innerHTML = metrics(s.m);
  document.getElementById('p-diff').innerHTML = s.diff;
  if (s.xs !== undefined && xsOn) { if (s.xsK !== undefined) xsSlider.value = s.xsK; drawXS(); }
  if (forceCam) flyTo(s.cam, s.tgt);
}
function flyTo(pos, tgt) {
  const p0 = camera.position.clone(), t0 = controls.target.clone();
  const p1 = new THREE.Vector3(...pos), t1 = new THREE.Vector3(...tgt), start = performance.now(), dur = 900;
  (function tick(now) {
    const t = Math.min(1, (now - start) / dur), e = t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    camera.position.lerpVectors(p0, p1, e); controls.target.lerpVectors(t0, t1, e);
    if (t < 1) requestAnimationFrame(tick);
  })(start);
}

// =====================================================================
// 8. THEME + TOOLBAR
// =====================================================================
function applyTheme() {
  const c = palette();
  scene.background = new THREE.Color(c.bg);
  M.shell.color.setHex(c.shell); M.shell.opacity = isDay ? 0.22 : 0.16;
  M.edge.color.setHex(c.edge); M.resin.color.setHex(c.resin);
  M.floorTop.color.setHex(c.floorTop); M.floorBase.color.setHex(c.floorBase);
  M.cavity.color.setHex(c.cavity); M.fluidA.color.setHex(c.A); M.fluidB.color.setHex(c.B);
  M.mixed.color.setHex(c.gel); M.bead.color.setHex(c.gel); M.plunger.color.setHex(c.plunger); M.tissue.color.setHex(c.tissue);
  cA.setHex(c.A); cB.setHex(c.B); cBp.setHex(c.Bpale); cG.setHex(c.gel);
  if (grid) scene.remove(grid);
  grid = new THREE.GridHelper(120, 60, c.grid1, c.grid2); grid.position.y = G.tissueY - 0.05; scene.add(grid);
  hemi.intensity = isDay ? 0.8 : 0.6;
  document.body.classList.toggle('light-mode', isDay);
  document.getElementById('b-theme').textContent = isDay ? '☀️ 白天' : '🌙 夜間';
  if (xsOn) drawXS();
}
function toggleTheme() { isDay = !isDay; applyTheme(); }
let flowOn = true;
function toggleFlow() { flowOn = !flowOn; pMesh.visible = flowOn; document.getElementById('b-flow').classList.toggle('on', flowOn); }
let shellMode = 0;
function toggleShell() {
  shellMode = (shellMode + 1) % 3; const b = document.getElementById('b-shell');
  shellGroup.visible = shellMode !== 2; M.shell.opacity = shellMode === 1 ? 0.55 : (isDay ? 0.22 : 0.16);
  b.textContent = ['🧊 外殼：半透明', '🧊 外殼：霧面', '🧊 外殼：隱藏'][shellMode]; b.classList.toggle('on', shellMode !== 2);
}
let syrOn = true, lblOn = true;
function refreshLabels() { labels.forEach(l => l.visible = lblOn && (l.userData.group !== 'syr' || syrOn)); }
function toggleSyr() { syrOn = !syrOn; syrGroup.visible = syrOn; document.getElementById('b-syr').classList.toggle('on', syrOn); refreshLabels(); }
function toggleLabels() { lblOn = !lblOn; document.getElementById('b-lbl').classList.toggle('on', lblOn); refreshLabels(); }
let xsOn = true;
function toggleXS() { xsOn = !xsOn; document.getElementById('xs').style.display = xsOn ? '' : 'none'; document.getElementById('b-xs').classList.toggle('on', xsOn); if (xsOn) drawXS(); }
function toggleRot() { controls.autoRotate = !controls.autoRotate; controls.autoRotateSpeed = 1.6; document.getElementById('b-rot').classList.toggle('on', controls.autoRotate); }

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); labelRenderer.setSize(innerWidth, innerHeight);
});

{
  const q = new URLSearchParams(location.hash.slice(1));
  if (q.get('theme') === 'dark') isDay = false;
  applyTheme(); writeParticles(); drawXS();
  if (q.get('shell')) { shellMode = +q.get('shell') - 1; toggleShell(); }
  const st = Math.max(0, Math.min(steps.length - 1, (+q.get('step') || 1) - 1));
  const inst = !!q.get('instant');
  setStep(st, !inst);
  if (inst) { const s = steps[st]; camera.position.set(...s.cam); controls.target.set(...s.tgt); }
}
(function animate() {
  requestAnimationFrame(animate);
  if (flowOn) { P.forEach(stepParticle); writeParticles(); }
  controls.update(); renderer.render(scene, camera); labelRenderer.render(scene, camera);
})();
</script>
